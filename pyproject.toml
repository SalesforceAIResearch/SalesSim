[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "salessim"
version = "0.1.0"
description = "SalesSim is an environment for simulating interactions between AI customers and e-commerce sales agents."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SalesSim Team"}
]
keywords = ["ai", "sales", "simulation", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # AI/ML Libraries
    "litellm>=1.49.0",
    "openai>=1.51.0",
    "together>=1.3.0",
    "transformers>=4.0.0",
    "tokenizers>=0.22.0",
    "tiktoken>=0.12.0",

    # LangChain ecosystem
    "langchain-text-splitters>=0.3.4",
    "langchain-community>=0.3.13",
    "sentence_transformers",

    # Data & ML utilities
    "datasets>=4.8.0",
    "huggingface-hub>=1.10.0",
    "numpy>=2.0.0",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "uvicorn",

    # Evaluation metrics
    "rouge>=1.0.0",
    "sacrebleu>=2.4.0",

    # Web frameworks & HTTP
    "fastapi>=0.100.0",
    "aiohttp>=3.13.0",
    "httpx>=0.27.0",

    # Data validation & schemas
    "pydantic>=2.8.0",

    # Utilities
    "PyYAML>=6.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",
    "typer>=0.12.0",
    "faiss-cpu",
    "rich>=13.9.0",

]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]


[project.urls]
Homepage = "https://github.com/your-org/salessim"
Repository = "https://github.com/your-org/salessim"
Issues = "https://github.com/your-org/salessim/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["salessim*", "common*"]
exclude = ["tests*", "scripts*", "venv*", "verl*", "wandb*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json"]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
